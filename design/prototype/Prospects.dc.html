const chip = (on) => 'flex-shrink: 0; min-height: 40px; padding: 0 14px; border-radius: 999px; font-size: 13px; font-weight: 600; cursor: pointer; ' + (on ? 'background: #12305A; color: #FFFFFF; border: 1px solid #12305A' : 'background: #FFFFFF; color: #12305A; border: 1px solid #C5CCD8');
